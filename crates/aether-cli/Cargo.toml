[package]
name = "aether-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aether"
path = "src/main.rs"

[[bin]]
name = "aether-mcp"
path = "src/mcp.rs"

[dependencies]
aether-config = { path = "../aether-config" }
aether-models = { path = "../aether-models" }
aether-tools = { path = "../aether-tools" }
aether-core = { path = "../aether-core" }
aether-permissions = { path = "../aether-permissions" }
aether-sessions = { path = "../aether-sessions" }
aether-mind = { path = "../aether-mind" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
