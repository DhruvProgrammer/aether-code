[package]
name = "aether-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluggable hook/event system for AETHER — typed middleware for model I/O, tools, context, snapshots, sessions, and lifecycle"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"
parking_lot = "0.12"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
