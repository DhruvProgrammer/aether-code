[package]
name = "aether-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "aether desktop app (Tauri window with embedded aether engine)"
publish = false

[[bin]]
name = "aether-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
aether-config = { path = "../aether-config" }
aether-permissions = { path = "../aether-permissions" }
aether-context = { path = "../aether-context" }
aether-registry = { path = "../aether-registry" }
aether-mind = { path = "../aether-mind" }
aether-sessions = { path = "../aether-sessions" }
aether-analysis = { path = "../aether-analysis" }
aether-gateway = { path = "../aether-gateway" }
aether-cli = { path = "../aether-cli" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
dirs = "5"

[features]
default = []
