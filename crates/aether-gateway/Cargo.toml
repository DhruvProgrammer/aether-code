[package]
name = "aether-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AETHER Model Gateway — explicit per-role provider/model access. No routing, no fallback, no auto-switching."

[dependencies]
aether-config = { path = "../aether-config" }
aether-models = { path = "../aether-models" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["time", "rt-multi-thread", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
