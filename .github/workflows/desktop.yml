name: Desktop (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install npm deps
        run: npm install
        working-directory: packages/app

      - name: Build frontend
        run: npm run build
        working-directory: packages/app

      - name: Build aether CLI (release)
        run: cargo build -p aether-cli --release --bins

      - name: Copy CLI into Tauri resources
        shell: bash
        run: |
          mkdir -p crates/aether-desktop/binaries
          cp target/release/aether.exe crates/aether-desktop/binaries/aether.exe
          cp target/release/aether-mcp.exe crates/aether-desktop/binaries/aether-mcp.exe

      - name: Stage frontend dist for Tauri
        shell: bash
        run: |
          mkdir -p crates/aether-desktop/dist
          cp -r packages/app/dist/. crates/aether-desktop/dist/

      - name: Build Tauri installer
        working-directory: crates/aether-desktop
        env:
          TAURI_BUNDLER_TOOLS_GLOBAL: true
        run: |
          cargo install tauri-cli --version "^2.0" --locked
          cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Locate installer
        id: locate
        shell: bash
        run: |
          ls -la target/x86_64-pc-windows-msvc/release/bundle/nsis/
          echo "artifact_dir=target/x86_64-pc-windows-msvc/release/bundle/nsis" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-desktop-windows
          path: ${{ steps.locate.outputs.artifact_dir }}/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aether-desktop-windows
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.exe
