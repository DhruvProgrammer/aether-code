name: Desktop (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: aether
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aether/target
          key: cargo-${{ runner.os }}-${{ hashFiles('aether/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install npm deps
        working-directory: aether/packages/app
        run: npm install

      - name: Build frontend
        working-directory: aether/packages/app
        run: npm run build

      - name: Build aether CLI (release)
        working-directory: aether
        run: cargo build -p aether-cli -p aether-mcp --release

      - name: Copy CLI into Tauri resources
        shell: bash
        run: |
          mkdir -p aether/crates/aether-desktop/binaries
          cp aether/target/release/aether.exe aether/crates/aether-desktop/binaries/aether-x86_64-pc-windows-msvc.exe
          cp aether/target/release/aether-mcp.exe aether/crates/aether-desktop/binaries/aether-mcp-x86_64-pc-windows-msvc.exe

      - name: Build Tauri installer
        working-directory: aether/crates/aether-desktop
        env:
          TAURI_BUNDLER_TOOLS_GLOBAL: true
        run: |
          cargo install tauri-cli --version "^2.0" --locked
          cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Locate installer
        id: locate
        shell: bash
        run: |
          ls -la aether/crates/aether-desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis/
          echo "artifact_dir=aether/crates/aether-desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-desktop-windows
          path: ${{ steps.locate.outputs.artifact_dir }}/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aether-desktop-windows
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.exe
