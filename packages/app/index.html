<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aether</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              app: {
                bg: '#0f1115',
                topbar: '#161922',
                surface: '#161922',
                hover: '#1d2230',
                border: '#2a2f3d',
                textPrimary: '#e8e8e8',
                textSecondary: '#8c9296',
                brand: '#7ca6b4',
                warning: '#e8a94c',
                error: '#bc484a',
                inputBg: '#161922',
              },
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', '"Liberation Mono"', '"Courier New"', 'monospace'],
            },
          },
        },
      };
    </script>
    <style>
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2a2f3d; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #8c9296; }
      html, body, #app { height: 100%; }
      body { background: #0f1115; color: #e8e8e8; }
      .bg-cover-blur { filter: blur(0px); }
      .msg-block { animation: fadeIn 0.18s ease-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
      .thinking-dot { animation: pulse 1.2s infinite ease-in-out; }
      .thinking-dot:nth-child(2) { animation-delay: 0.15s; }
      .thinking-dot:nth-child(3) { animation-delay: 0.30s; }
      @keyframes pulse { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }

      /* ---- Background layer (spec §16): image sits behind an opacity layer
              which sits behind the entire UI. UI elements are NOT faded. ---- */
      #bg-layer { position: fixed; inset: 0; z-index: -10; overflow: hidden; pointer-events: none; }
      #bg-img   { width: 100%; height: 100%; object-fit: cover; display: none; }
      #bg-fade  { position: absolute; inset: 0; background: #0f1115; transition: opacity 0.18s linear; }

      /* ---- Settings modal compact styling ---- */
      .settings-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      @media (max-width: 880px) { .settings-grid { grid-template-columns: 1fr; } }
      .model-card   { background: #1d2230; border: 1px solid #2a2f3d; border-radius: 10px; padding: 14px; }
      .model-card .field { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
      .model-card input  { width: 100%; background: #0f1115; border: 1px solid #2a2f3d; border-radius: 6px; padding: 6px 8px; color: #e8e8e8; font-size: 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .model-card input:focus { outline: none; border-color: #7ca6b4; }
      .model-card .field label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #8c9296; }
      .role-pill { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #2a2f3d; color: #7ca6b4; letter-spacing: 0.05em; }
      .role-pill.opt { color: #8c9296; }
      .slot-title { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: #e8e8e8; }
      .role-desc  { font-size: 11px; color: #8c9296; }

      .provider-row { display: grid; grid-template-columns: 1.2fr 2fr 2fr 1.4fr 1.4fr auto; gap: 8px; align-items: center; }
      .provider-row.header { color: #8c9296; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
      .provider-row input { background: #0f1115; border: 1px solid #2a2f3d; border-radius: 6px; padding: 5px 8px; color: #e8e8e8; font-size: 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; min-width: 0; }
      .provider-row input:focus { outline: none; border-color: #7ca6b4; }
      .settings-section { padding-top: 16px; padding-bottom: 16px; border-top: 1px solid #2a2f3d; }
      .settings-section:first-of-type { border-top: none; }
      .settings-section h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7ca6b4; margin-bottom: 10px; }
      .toggle { display: inline-flex; align-items: center; cursor: pointer; user-select: none; }
      .toggle .knob { width: 28px; height: 16px; background: #2a2f3d; border-radius: 8px; position: relative; transition: background 0.15s; }
      .toggle .knob::after { content: ''; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; background: #8c9296; border-radius: 50%; transition: transform 0.15s, background 0.15s; }
      .toggle.on .knob { background: #7ca6b4; }
      .toggle.on .knob::after { transform: translateX(12px); background: #0f1115; }
      .toggle .label { margin-left: 8px; font-size: 12px; color: #e8e8e8; }
      input[type=range].opacity-slider { width: 100%; accent-color: #7ca6b4; }
      .bg-preview { width: 100%; aspect-ratio: 16/9; background: #0f1115; border: 1px solid #2a2f3d; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
      .bg-preview img { width: 100%; height: 100%; object-fit: cover; }
      .validation-err { color: #bc484a; font-size: 11px; font-family: 'JetBrains Mono', monospace; white-space: pre-wrap; margin-top: 6px; }
      .validation-ok  { color: #7ca6b4; font-size: 11px; margin-top: 6px; }

      /* ---- Sidebar collapse (spec §30) ---- */
      #workspace-sidebar { transition: width 0.22s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
      #workspace-sidebar.collapsed { width: 48px !important; }
      #workspace-sidebar.collapsed .collapse-hide { display: none !important; }
      #workspace-sidebar.collapsed .collapse-show { display: flex !important; }
      #main-content { transition: margin-left 0.22s cubic-bezier(.2,.8,.2,1); }
      .sidebar-toggle { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; border: 1px solid #2a2f3d; color: #8c9296; background: #1d2230; }
      .sidebar-toggle:hover { border-color: #7ca6b4; color: #7ca6b4; }
      /* ---- Provider card redesign ---- */
      .provider-card { background: #1d2230; border: 1px solid #2a2f3d; border-radius: 10px; padding: 16px; }
      .provider-field { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
      .provider-field label { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #8c9296; }
      .provider-field input, .provider-field select { background: #0f1115; border: 1px solid #2a2f3d; border-radius: 6px; padding: 6px 8px; color: #e8e8e8; font-size: 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .provider-field input:focus, .provider-field select:focus { outline: none; border-color: #7ca6b4; }
      .provider-header-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
      /* ---- Modal overlays for provider/model ---- */
      .modal-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); display:none; align-items:center; justify-content:center; padding: 20px; }
      .modal-overlay.open { display:flex; }
      .modal-card { background:#161922; border:1px solid #2a2f3d; border-radius: 12px; width: 100%; max-width: 560px; max-height: 85vh; overflow: hidden; display:flex; flex-direction:column; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body class="font-sans h-screen flex flex-col overflow-hidden antialiased">
    <!-- Background layer (spec §16). Always rendered; fades to solid bg when off. -->
    <div id="bg-layer">
      <img alt="" id="bg-img" />
      <div id="bg-fade"></div>
    </div>

    <!-- BEGIN: Workspace Home Screen (shown when no workspace is active) -->
    <div id="workspace-home" class="fixed inset-0 z-40 flex items-center justify-center" style="display:none">
      <div class="max-w-lg w-full mx-4">
        <div class="text-center mb-8">
          <h1 class="text-2xl font-semibold text-app-brand mb-2">AETHER</h1>
          <p class="text-app-textSecondary text-sm" id="ws-home-subtitle">Select a folder to start working.</p>
        </div>
        <div id="ws-recent-list" class="space-y-2 mb-6"></div>
        <div class="text-center">
          <button id="ws-select-folder-btn" class="inline-flex items-center space-x-2 bg-app-brand text-app-bg font-semibold px-5 py-2.5 rounded-lg text-sm hover:opacity-90 transition-opacity">
            <i class="w-4 h-4" data-lucide="folder-open"></i>
            <span>Select Folder</span>
          </button>
        </div>
      </div>
    </div>

    <!-- BEGIN: Workspace Sidebar (shown when a workspace is active) -->
    <div id="workspace-sidebar" class="fixed left-0 top-10 bottom-0 w-64 bg-app-surface border-r border-app-border z-30 flex-col" style="display:none">
      <div class="p-4 border-b border-app-border">
        <div class="flex items-center justify-between">
          <div class="min-w-0 collapse-hide">
            <div id="ws-sidebar-name" class="text-sm font-semibold text-app-textPrimary truncate">Workspace</div>
            <div id="ws-sidebar-path" class="text-xs text-app-textSecondary truncate font-mono"></div>
          </div>
          <div class="flex items-center space-x-1 shrink-0">
            <button id="sidebar-toggle" class="sidebar-toggle" title="Collapse sidebar">
              <i class="w-3.5 h-3.5" data-lucide="panel-left-close"></i>
            </button>
            <button id="ws-switch-btn" class="text-app-textSecondary hover:text-app-brand ml-1 collapse-hide" title="Switch folder">
              <i class="w-4 h-4" data-lucide="folder-open"></i>
            </button>
          </div>
        </div>
      </div>
      <div class="p-3 collapse-hide">
        <button id="ws-new-session-btn" class="w-full flex items-center space-x-2 text-xs text-app-textSecondary hover:text-app-brand border border-app-border rounded px-3 py-2 hover:border-app-brand transition-colors">
          <i class="w-3.5 h-3.5" data-lucide="plus"></i>
          <span>New Session</span>
        </button>
      </div>
      <div id="ws-session-list" class="flex-1 overflow-y-auto px-3 pb-3 space-y-1 collapse-hide"></div>
      <div class="collapse-show hidden items-center justify-center p-3">
        <button id="sidebar-expand" class="sidebar-toggle" title="Expand sidebar">
          <i class="w-3.5 h-3.5" data-lucide="panel-left-open"></i>
        </button>
      </div>
    </div>

    <!-- BEGIN: Top Window Controls -->
    <div class="h-10 bg-app-topbar border-b border-app-border flex items-center justify-between px-3 shrink-0">
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2 text-app-textSecondary">
          <i class="w-4 h-4" data-lucide="menu"></i>
          <i class="w-4 h-4" data-lucide="layout-grid"></i>
        </div>
        <div id="tabs" class="flex items-center space-x-1">
          <!-- tabs injected by JS -->
        </div>
        <button id="new-tab-btn" class="text-app-textSecondary hover:text-app-textPrimary" title="New tab">
          <i class="w-4 h-4" data-lucide="plus"></i>
        </button>
      </div>
      <div class="flex items-center space-x-3 text-app-textSecondary">
        <button id="open-settings-btn" class="hover:text-app-textPrimary" title="Settings">
          <i class="w-4 h-4" data-lucide="settings"></i>
        </button>
        <button id="open-history-btn" class="hover:text-app-textPrimary" title="History">
          <i class="w-4 h-4" data-lucide="folder-open"></i>
        </button>
        <span class="text-xs font-mono" id="version-label">v…</span>
      </div>
    </div>

    <!-- BEGIN: Main App Header -->
    <header id="app-header" class="flex items-center justify-between px-6 py-4 shrink-0">
      <h1 id="session-title" class="text-lg font-semibold text-app-brand">aether</h1>
      <div class="flex items-center space-x-4">
        <div id="status-pill" class="hidden items-center space-x-2 text-xs text-app-textSecondary bg-app-surface border border-app-border rounded-full px-3 py-1">
          <div class="w-3 h-3 rounded-full border-2 border-app-brand border-t-transparent animate-spin"></div>
          <span id="status-text">Working…</span>
        </div>
        <i class="w-5 h-5 text-app-textSecondary cursor-pointer hover:text-app-textPrimary" data-lucide="more-horizontal"></i>
      </div>
    </header>

    <!-- BEGIN: Main Content Area (chat stream) -->
    <main id="stream" class="flex-1 overflow-y-auto px-6 lg:px-24 xl:px-48 pb-32">
      <div id="messages" class="max-w-4xl mx-auto space-y-6">
        <div class="text-app-textSecondary text-sm italic" id="empty-hint">
          Ask aether anything. <kbd class="bg-app-surface px-1.5 py-0.5 rounded border border-app-border font-mono text-xs">/</kbd> for commands,
          <kbd class="bg-app-surface px-1.5 py-0.5 rounded border border-app-border font-mono text-xs">@</kbd> for context.
        </div>
      </div>
    </main>

    <!-- BEGIN: Input Area -->
    <div id="input-bar" class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-app-bg via-app-bg to-transparent">
      <div class="max-w-4xl mx-auto">
        <div class="bg-app-inputBg border border-app-border rounded-xl p-3 flex flex-col shadow-lg focus-within:border-app-brand/60 transition-colors">
          <textarea id="prompt-input" rows="1" class="w-full bg-transparent border-none text-app-textPrimary placeholder-app-textSecondary focus:ring-0 resize-none pb-3 text-sm font-sans" placeholder="Ask anything, / for commands, @ for context..."></textarea>
          <div class="flex items-center justify-between pt-2 border-t border-app-border/50">
            <div class="flex items-center space-x-4">
              <button id="attach-btn" class="p-1 text-app-textSecondary hover:text-app-brand hover:bg-app-hover rounded transition-colors" title="Attach file">
                <i class="w-4 h-4" data-lucide="paperclip"></i>
              </button>
              <button id="mode-btn" class="flex items-center space-x-1 text-sm text-app-textSecondary hover:text-app-brand hover:bg-app-hover px-2 py-1 rounded transition-colors">
                <span id="mode-label">Build</span>
                <i class="w-3 h-3" data-lucide="chevron-down"></i>
              </button>
              <button id="model-btn" class="flex items-center space-x-1 text-sm text-app-textSecondary hover:text-app-brand hover:bg-app-hover px-2 py-1 rounded transition-colors">
                <i class="w-3.5 h-3.5 mr-1" data-lucide="box"></i>
                <span id="model-label">controller</span>
                <i class="w-3 h-3" data-lucide="chevron-down"></i>
              </button>
              <button id="profile-btn" class="flex items-center space-x-1 text-sm text-app-textSecondary hover:text-app-brand hover:bg-app-hover px-2 py-1 rounded transition-colors">
                <span>Default</span>
                <i class="w-3 h-3" data-lucide="chevron-down"></i>
              </button>
            </div>
            <button id="send-btn" class="w-8 h-8 rounded-lg bg-app-surface border border-app-border hover:bg-app-hover hover:border-app-brand flex items-center justify-center text-app-textSecondary hover:text-app-brand transition-colors">
              <i class="w-4 h-4" data-lucide="arrow-up"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- BEGIN: Modals (settings / history / help) -->
    <div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm items-center justify-center p-8">
      <div class="bg-app-surface border border-app-border rounded-xl w-full max-w-5xl max-h-[85vh] overflow-hidden flex flex-col">
        <div class="flex items-center justify-between px-5 py-3 border-b border-app-border">
          <h2 id="modal-title" class="text-base font-semibold text-app-brand">Settings</h2>
          <button id="modal-close" class="text-app-textSecondary hover:text-app-textPrimary">
            <i class="w-5 h-5" data-lucide="x"></i>
          </button>
        </div>
        <div id="modal-body" class="overflow-y-auto p-5 flex-1"></div>
      </div>
    </div>

    <!-- Provider Modal -->
    <div id="provider-modal" class="modal-overlay">
      <div class="modal-card">
        <div class="flex items-center justify-between px-5 py-3 border-b border-app-border">
          <h2 id="provider-modal-title" class="text-sm font-semibold text-app-brand">Add Provider</h2>
          <button id="provider-modal-close" class="text-app-textSecondary hover:text-app-textPrimary"><i class="w-5 h-5" data-lucide="x"></i></button>
        </div>
        <div id="provider-modal-body" class="p-5 overflow-y-auto space-y-4"></div>
      </div>
    </div>
    <!-- Model Modal -->
    <div id="model-modal" class="modal-overlay">
      <div class="modal-card">
        <div class="flex items-center justify-between px-5 py-3 border-b border-app-border">
          <h2 id="model-modal-title" class="text-sm font-semibold text-app-brand">Add Model</h2>
          <button id="model-modal-close" class="text-app-textSecondary hover:text-app-textPrimary"><i class="w-5 h-5" data-lucide="x"></i></button>
        </div>
        <div id="model-modal-body" class="p-5 overflow-y-auto space-y-4"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
