[workspace]
resolver = "2"
members = [
    "crates/aether-config",
    "crates/aether-permissions",
    "crates/aether-models",
    "crates/aether-tools",
    "crates/aether-context",
    "crates/aether-registry",
    "crates/aether-core",
    "crates/aether-cli",
    "crates/aether-sessions",
    "crates/aether-mind",
    "crates/aether-desktop",
    "crates/aether-plugin",
    "crates/aether-evidence",
    "crates/aether-analysis",
    "crates/aether-gateway",
    "crates/aether-workspace",
    "crates/aether-changes",
]

[workspace.package]
  version = "0.23.0"
edition = "2021"
license = "MIT"
authors = ["aether contributors"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1
